name: Build Debug Secure APK
on:
  push:
  workflow_dispatch:
    inputs:
      application_id:
        description: 'Play Console 패키지 ID (비워두면 build.gradle.kts 기본값 사용)'
        required: false
        default: ''
      version_code:
        description: '버전 코드 (비워두면 기본값 사용)'
        required: false
        default: ''
      version_name:
        description: '버전 이름 (비워두면 기본값 사용)'
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Debug APK
        env:
          ANDROID_APPLICATION_ID: ${{ github.event.inputs.application_id }}
          ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QC261127-debug-apk
          path: app/build/outputs/apk/debug/*.apk