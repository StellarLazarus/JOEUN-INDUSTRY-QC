      const SALT_B64 = "53l25XpJxdw+T2v6X1RCLA==";
      const IV_B64 = "LClgJBCb/ICREKGz";
      const b64ToBytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

      async function decryptAndMount(secret) {
        if (!window.crypto || !window.crypto.subtle) {
          throw new Error('보안 컨텍스트(HTTPS 또는 localhost)가 아니어서 Web Crypto 복호화를 실행할 수 없습니다.');
        }
        const keyMat = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), { name: 'PBKDF2' }, false, ['deriveKey']);
        const aesKey = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64ToBytes(SALT_B64), iterations: 100000, hash: 'SHA-256' },
          keyMat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(IV_B64) }, aesKey, b64ToBytes(CIPHER_B64));
        const hashBuf = await crypto.subtle.digest('SHA-256', plainBuf);
        const actualHash = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
        if (true && EXPECTED_HASH && actualHash !== EXPECTED_HASH) {
          throw new Error('무결성 해시 불일치: 파일이 변조되었습니다.');
        }
        const html = new TextDecoder().decode(plainBuf);
        document.open();
        document.write(html);
        document.close();
      }

      if (window.__AUTO_KEY__) {
        decryptAndMount(window.__AUTO_KEY__).catch(err => {
          document.body.innerHTML = '<p style="color:red;padding:20px;">' + err.message + '</p>';
        });
      } else {
        document.getElementById('unlock-form').addEventListener('submit', async e => {
          e.preventDefault();
          const errEl = document.getElementById('err-msg');
          errEl.textContent = '';
          try {
            await decryptAndMount(document.getElementById('pass-input').value);
          } catch (err) {
            errEl.textContent = '복호화 실패: 키가 올바르지 않거나 파일이 손상되었습니다.';
          }
        });
      }
