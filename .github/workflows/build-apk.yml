name: Build Signed Secure APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias securepack -keyalg RSA -keysize 2048 -validity 10000 -storepass securepack123 -keypass securepack123 -dname "CN=SecurePack, OU=App, O=SecurePack, L=Seoul, C=KR"
      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASS: securepack123
          KEY_ALIAS: securepack
          KEY_PASS: securepack123
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: JOEUNINDUSTRY-release-apk
          path: app/build/outputs/apk/release/*.apk
